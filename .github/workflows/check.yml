name: Check Music Loops
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/core.js
      - run: node --check assets/audio.js
      - run: node --check assets/app.js
      - run: node --test tests/*.test.cjs
